      <div class ="container">
        
    <h1 id = "Heading">Analog Clock </h1>

<br>
      <div class="analog-clock">
  <div class="ac-face">
    <div class="ac-hand ac-hour" id="ac-hour"></div>
    <div class="ac-hand ac-minute" id="ac-minute"></div>
    <div class="ac-hand ac-second" id="ac-second"></div>
   
    <div class="ac-dot"></div>
    <span class="ac-num ac1">1</span>
    <span class="ac-num ac2">2</span>
    <span class="ac-num ac3">3</span>
    <span class="ac-num ac4">4</span>
    <span class="ac-num ac5">5</span>
    <span class="ac-num ac6">6</span>
    <span class="ac-num ac7">7</span>
    <span class="ac-num ac8">8</span>
    <span class="ac-num ac9">9</span>
    <span class="ac-num ac10">10</span>
    <span class="ac-num ac11">11</span>
    <span class="ac-num ac12">12</span>
  </div>
</div>
<script src = "analog.js"></script>
</body>
</html>
